# The Helmcode layer as its own profile bundle: the brand skin, the European
# inference route, the residency and egress guard, the PII redaction channel, and
# the retrieval index behind the `ctx.retrieval` seam, inserted over the
# composition `dsh-web-app` leaves behind.
# `PROFILE_TEMPLATES.web` stacks this bundle after `dsh-web-app`, so both rows
# join the same roster without a Helmcode line in any upstream patch file.

- insert:
    # Helmcode: inferencia europea compatible con OpenAI, tarifa plana y cero
    # registros, en https://api.helmcode.com/v1 con la clave en
    # HELMCODE_API_KEY.
    #
    # Es una FILA PROPIA, no una clave mas dentro del dict `providers` de la fila
    # de arriba, por una razon medida con `--dump-config`: un patch posterior
    # reemplaza la config COMPLETA de la fila a la que apunta. El patch del
    # perfil de esta maquina reescribe `llm-pi-ai` para anadir su septimo modelo
    # NaN, y con esa reescritura se llevaba por delante cualquier proveedor
    # declarado dentro de la misma fila: la ruta Helmcode desaparecia de la
    # config compuesta. Con id propio sobrevive a todas las capas.
    # `settingsNs` es el id de la fila (`ctx.fiber.entry?.options.id`), no una
    # constante, asi que las dos instancias del plugin no colisionan.
    #
    # Solo los modelos que corren en la UE. La misma clave sirve nueve modelos
    # frontera de OpenAI, Anthropic y Google que corren en Estados Unidos; no se
    # declaran hasta que exista la guardia de residencia, de modo que sacar un
    # dato de la UE sea imposible por construccion y no dependa de una politica
    # que alguien pueda desactivar.
    #
    # Los otros cuatro modelos del plan (qwen3-embedding, rerank, whisper y
    # kokoro) no son conversacion y no pasan por pi-ai: van por los seams de
    # recuperacion y de voz.
    #
    # `compat` se deja sin declarar a proposito: la documentacion dice que la
    # traza de razonamiento llega en `message.reasoning_content`, pero sin una
    # clave real no se puede comprobar como la interpreta pi-ai, y declarar de
    # mas se paga en cada peticion.
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          # NaN Builders: la ruta que ya funcionaba, con el glm5.3 que antes
          # anadia el override manual del perfil. Ahora esta aqui para que el
          # perfil no necesite override: este config reemplaza el del bundle
          # base completo y declara ambos proveedores.
          nan-builders:
            displayName: NaN Builders
            api: openai-completions
            baseURL: https://api.nan.builders/v1
            apiKeyEnv: NAN_BUILDERS_API_KEY
            compat:
              thinkingFormat: deepseek
              supportsDeveloperRole: true
            models:
              - id: deepseek-v4-flash
                name: DeepSeek V4.1 Flash
                contextWindow: 1048576
                maxTokens: 32768
                input: [text, image]
                reasoningEfforts:
                  low: low
                  medium: medium
                  high: high
              - id: glm5.3
                name: GLM 5.3
                contextWindow: 1048576
                maxTokens: 32768
                input: [text, image]
                reasoningEfforts:
                  low: low
                  medium: medium
                  high: high
                  max: max
              - id: glm5.3-flash
                name: GLM 5.3 Flash
                contextWindow: 1048576
                maxTokens: 32768
                input: [text, image]
                reasoningEfforts:
                  low: low
                  medium: medium
                  high: high
                  max: max
              - id: qwen3.6
                name: Qwen 3.6
                contextWindow: 262144
                maxTokens: 65536
                input: [text, image]
                reasoningEfforts:
                  off: none
                  minimal: minimal
                  low: low
                  medium: medium
                  high: high
                  max: max
              - id: qwen3.8-flash
                name: Qwen 3.8 Flash
                contextWindow: 262144
                maxTokens: 32768
                input: [text, image]
                reasoningEfforts:
                  low: low
                  medium: medium
                  high: high
              - id: gemma4
                name: Gemma 4
                contextWindow: 262144
                maxTokens: 65536
                input: [text, image]
                reasoningEfforts:
                  off: none
                  minimal: minimal
                  low: low
                  medium: medium
                  high: high
                  max: max
              - id: mimo-v2.6-flash
                name: MiMo V2.6 Flash
                contextWindow: 1048576
                maxTokens: 32768
                input: [text, image]
                reasoningEfforts:
                  low: low
                  medium: medium
                  high: high
          helmcode:
            displayName: Helmcode
            api: openai-completions
            baseURL: https://api.helmcode.com/v1
            apiKeyEnv: HELMCODE_API_KEY
            models:
              # Razonamiento adaptativo: los niveles orientan, no limitan, y
              # `off` apaga la fase. Sin `maxTokens` por modelo, a proposito: en
              # pi-ai ese campo se materializa como TOPE POR PETICION y Helmcode
              # no documenta tope de salida, asi que el tamano por defecto de la
              # ruta se aplica como dimension del modelo y no como limite.
              - id: deepseek-v4-flash
                name: DeepSeek V4.1 Flash
                contextWindow: 1048576
                input: [text]
                reasoningEfforts:
                  off: none
                  minimal: minimal
                  low: low
                  medium: medium
                  high: high
                  max: max
              # La opcion por defecto de Helmcode para agentes de codigo, y su
              # frontera abierta. Entrada de imagen y video en el servidor; pi-ai
              # solo sabe declarar texto e imagen.
              - id: glm5.3-flash
                name: GLM 5.3 Flash
                contextWindow: 1048576
                input: [text, image]
                reasoningEfforts:
                  low: low
                  medium: medium
                  high: high
                  max: max
              # El caballo de batalla: absorbe tres cuartas partes del trafico
              # real de Helmcode y sus tokens son ilimitados en todos los planes.
              - id: qwen3.6
                name: Qwen 3.6
                contextWindow: 262144
                input: [text, image]
                reasoningEfforts:
                  off: none
                  minimal: minimal
                  low: low
                  medium: medium
                  high: high
                  max: max
              # Asistentes internos y trabajo con documentos.
              - id: gemma4
                name: Gemma 4
                contextWindow: 262144
                input: [text, image]
                reasoningEfforts:
                  off: none
                  minimal: minimal
                  low: low
                  medium: medium
                  high: high
                  max: max
              # GLM 5.3 (sin flash) no se declara: es un add-on de 150 EUR por
              # key al mes que ningun plan cubre, con su propia cuota y 10
              # concurrentes. Se activa por key, no por despliegue. No acepta
              # `off`: ofrecerlo rompe la llamada con
              # UNSUPPORTED_REASONING_EFFORT, porque el runtime no hace clamping.
              #
              # - id: glm5.3
              #   name: GLM 5.3
              #   contextWindow: 1048576
              #   input: [text, image]
              #   reasoningEfforts:
              #     low: low
              #     medium: medium
              #     high: high
              #     max: max

    # Helmcode identity: brand token layer, brand sheet and the kit's lockup.
    - id: ui-brand-helmcode
      name: '@deepseek-ai/dsh-client-ui-brand-helmcode'

    # Guardia de residencia y de egreso. Veta en el waterfall `llm/stream` toda
    # ruta de modelo que no sea europea y, en `tools/pre-execute`, las
    # herramientas que abren su propio trafico (subagentes externos, servidores
    # MCP, `web_fetch`, `web_search`), que no pasan por ese waterfall.
    #
    # `mode: 'open'` es lo que corresponde a ESTE bundle: el modo es una decision
    # de DESPLIEGUE, y quien la toma es el perfil del cliente —es su tratamiento
    # del dato—, no un paquete compartido. Un cliente regulado pone `'eu-only'` en
    # su propio `cordis.patch.yml` (o en la fila de su perfil), que es donde se
    # declara el despliegue; aqui no se puede imponer, porque este bundle tambien
    # sirve a la maquina de desarrollo, que no es un despliegue regulado, y un
    # `eu-only` por defecto romperia rutas legitimas que no estan en la tabla de
    # residencia.
    #
    # No va en los `presets`: la guardia no es una herramienta del turno (el
    # modelo no la invoca), es un plugin del pipeline.
    - id: guard-eu-routing
      name: '@deepseek-ai/dsh-guard-eu-routing'
      config:
        mode: 'open'

    # Canal de redaccion de PII. Es una CAPACIDAD EXPLICITA (plan §18): no hay
    # interceptor, el agente redacta cuando usa `anonymize` o
    # `workspace_read_anonymized`. El mapa que hace reversible la redaccion vive
    # entre sesiones, sellado con AES-256-GCM, en `<DSH_HOME>/privacy/map.v1`
    # por defecto; `ttlDays: 30` acota la caducidad de las entradas nuevas.
    #
    # La CLAVE del mapa NO se declara aqui: este fichero es un patch compartido y
    # en claro, y una clave en el seria una clave publicada. Vive en el credential
    # store bajo la referencia `PRIVACY_MAP_KEY` (el campo `mapKeyRef` existe para
    # apuntar a otra). Sin esa credencial las dos herramientas fallan en vez de
    # devolver texto sin redactar, que es el lado fail-closed del diseno.
    - id: privacy-helmcode
      name: '@deepseek-ai/dsh-privacy-helmcode'
      config:
        ttlDays: 30

    # Recuperacion: el indice local y las dos herramientas que lo usan
    # (`index_workspace` y `knowledge_search`). El plugin declara y provee el seam
    # `ctx.retrieval`, y su nucleo puro no tiene ningun camino de red por defecto:
    # el cableado le inyecta `globalThis.fetch` explicitamente.
    #
    # EGRESO: las dos herramientas llaman a https://api.helmcode.com/v1 (los
    # endpoints `/v1/embeddings` con el modelo qwen3-embedding y `/v1/rerank`) y
    # sus descripciones lo declaran, porque es una salida que el waterfall
    # `llm/stream` no ve. El procesamiento es de residencia europea.
    #
    # La CLAVE no se declara aqui —este patch es compartido y en claro—: vive en el
    # credential store bajo la referencia `HELMCODE_API_KEY` (el campo `apiKeyRef`
    # existe para apuntar a otra). Sin esa credencial, o si Helmcode contesta
    # 401/402, las dos herramientas FALLAN con el codigo y la causa en vez de
    # devolver resultados sin recuperacion real; un documento sin texto es un no-op
    # declarado, no un error.
    #
    # El indice vive en `<DSH_HOME>/retrieval/index.sqlite` por defecto y `sources`
    # declara los documentos que `index_workspace` recorre (nombre logico → ruta
    # relativa al workspace de la sesion). El ejemplo va comentado porque las rutas
    # son del despliegue, no del bundle:
    - id: retrieval-helmcode
      name: '@deepseek-ai/dsh-retrieval-helmcode'
      config:
        topK: 8
        topN: 4
        # sources:
        #   manual: docs/manual.md
        #   faq: docs/faq.md

    # Identidad local: atribucion durable de cada sesion a un operador. NO es
    # autenticacion: el plugin no anade credencial ni puerta, y quien tiene la URL
    # de arranque sigue siendo el dueno del harness. Registra el comando host
    # `/operator <nombre>` y el evento `identity/operator` (durable y solo-log:
    # queda FUERA del transcript del modelo), pliega la proyeccion de sesion
    # `operator` y expone `ctx.identityLocal`, que es lo que leen el export y el
    # informe de evidencia. El estado sin operador es una ausencia declarada, no un
    # valor por defecto adivinado.
    #
    # El OPERADOR POR DEFECTO lo pone el perfil del cliente, no este bundle
    # compartido: quien es el operador de un despliegue es un dato del despliegue.
    # Por eso la fila va sin `config` y las dos claves van comentadas aqui:
    # `defaultOperator` siembra las sesiones que no registren su propio evento, y
    # `requireOperator` avisa por el log del proceso (nunca bloquea el turno)
    # cuando una sesion nace sin operador.
    - id: identity-local
      name: '@deepseek-ai/dsh-identity-local'
      # config:
      #   defaultOperator: <nombre del operador>
      #   requireOperator: true

    # Medidor local de cuota: registra la proyeccion de sesion `quotaEstimate`,
    # que pliega los eventos `assistant/message` y acumula tokens por cubo del
    # plan. Es un ESTIMADOR: el limite real es por key y por organizacion, y
    # quien lo conoce es la consola de Helmcode. La tarjeta que lo pinta vive en
    # `ui-brand-helmcode` y lo lee por el cable de la sesion.
    #
    # Cubre las rutas `helmcode` y `nan-builders`: el dueño confirmo que NaN
    # Builders es su suscripcion de Helmcode, asi que ambas dibujan de la misma
    # cuota. Sin `config`: el plan asumido es el defecto de la tabla, y el
    # perfil puede declarar otro.
    - id: quota-helmcode
      name: '@deepseek-ai/dsh-quota-helmcode'
