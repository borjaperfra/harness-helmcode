# The Helmcode layer as its own profile bundle: the brand skin and the European
# inference route, inserted over the composition `dsh-web-app` leaves behind.
# `PROFILE_TEMPLATES.web` stacks this bundle after `dsh-web-app`, so both rows
# join the same roster without a Helmcode line in any upstream patch file.

- insert:
    # Helmcode: inferencia europea compatible con OpenAI, tarifa plana y cero
    # registros, en https://api.helmcode.com/v1 con la clave en
    # HELMCODE_API_KEY.
    #
    # Es una FILA PROPIA, no una clave mas dentro del dict `providers` de la fila
    # de arriba, por una razon medida con `--dump-config`: un patch posterior
    # reemplaza la config COMPLETA de la fila a la que apunta. El patch del
    # perfil de esta maquina reescribe `llm-pi-ai` para anadir su septimo modelo
    # NaN, y con esa reescritura se llevaba por delante cualquier proveedor
    # declarado dentro de la misma fila: la ruta Helmcode desaparecia de la
    # config compuesta. Con id propio sobrevive a todas las capas.
    # `settingsNs` es el id de la fila (`ctx.fiber.entry?.options.id`), no una
    # constante, asi que las dos instancias del plugin no colisionan.
    #
    # Solo los modelos que corren en la UE. La misma clave sirve nueve modelos
    # frontera de OpenAI, Anthropic y Google que corren en Estados Unidos; no se
    # declaran hasta que exista la guardia de residencia, de modo que sacar un
    # dato de la UE sea imposible por construccion y no dependa de una politica
    # que alguien pueda desactivar.
    #
    # Los otros cuatro modelos del plan (qwen3-embedding, rerank, whisper y
    # kokoro) no son conversacion y no pasan por pi-ai: van por los seams de
    # recuperacion y de voz.
    #
    # `compat` se deja sin declarar a proposito: la documentacion dice que la
    # traza de razonamiento llega en `message.reasoning_content`, pero sin una
    # clave real no se puede comprobar como la interpreta pi-ai, y declarar de
    # mas se paga en cada peticion.
    - id: llm-pi-ai-helmcode
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          helmcode:
            displayName: Helmcode
            api: openai-completions
            baseURL: https://api.helmcode.com/v1
            apiKeyEnv: HELMCODE_API_KEY
            models:
              # Razonamiento adaptativo: los niveles orientan, no limitan, y
              # `off` apaga la fase. Sin `maxTokens` por modelo, a proposito: en
              # pi-ai ese campo se materializa como TOPE POR PETICION y Helmcode
              # no documenta tope de salida, asi que el tamano por defecto de la
              # ruta se aplica como dimension del modelo y no como limite.
              - id: deepseek-v4-flash
                name: DeepSeek V4.1 Flash
                contextWindow: 1048576
                input: [text]
                reasoningEfforts:
                  off: none
                  minimal: minimal
                  low: low
                  medium: medium
                  high: high
                  max: max
              # La opcion por defecto de Helmcode para agentes de codigo, y su
              # frontera abierta. Entrada de imagen y video en el servidor; pi-ai
              # solo sabe declarar texto e imagen.
              - id: glm5.3-flash
                name: GLM 5.3 Flash
                contextWindow: 1048576
                input: [text, image]
                reasoningEfforts:
                  low: low
                  medium: medium
                  high: high
                  max: max
              # El caballo de batalla: absorbe tres cuartas partes del trafico
              # real de Helmcode y sus tokens son ilimitados en todos los planes.
              - id: qwen3.6
                name: Qwen 3.6
                contextWindow: 262144
                input: [text, image]
                reasoningEfforts:
                  off: none
                  minimal: minimal
                  low: low
                  medium: medium
                  high: high
                  max: max
              # Asistentes internos y trabajo con documentos.
              - id: gemma4
                name: Gemma 4
                contextWindow: 262144
                input: [text, image]
                reasoningEfforts:
                  off: none
                  minimal: minimal
                  low: low
                  medium: medium
                  high: high
                  max: max
              # GLM 5.3 (sin flash) no se declara: es un add-on de 150 EUR por
              # key al mes que ningun plan cubre, con su propia cuota y 10
              # concurrentes. Se activa por key, no por despliegue. No acepta
              # `off`: ofrecerlo rompe la llamada con
              # UNSUPPORTED_REASONING_EFFORT, porque el runtime no hace clamping.
              #
              # - id: glm5.3
              #   name: GLM 5.3
              #   contextWindow: 1048576
              #   input: [text, image]
              #   reasoningEfforts:
              #     low: low
              #     medium: medium
              #     high: high
              #     max: max

    # Helmcode identity: brand token layer, brand sheet and the kit's lockup.
    - id: ui-brand-helmcode
      name: '@deepseek-ai/dsh-client-ui-brand-helmcode'
