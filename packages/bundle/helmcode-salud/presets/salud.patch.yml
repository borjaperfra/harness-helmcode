# Preset de agente del sector salud: una declaracion de
# `@deepseek-ai/dsh-agent-preset` insertada despues del patch del bundle. Es el
# preset que un asistente clinico selecciona, y su lista de herramientas es la
# RESTRINGIDA del sector: la superficie del turno es la del trabajo con
# documentacion clinica y nada mas.
#
# LAS CAPACIDADES DE PRIVACIDAD Y RECUPERACION ESTAN DENTRO, y no se declaran
# aqui: sus filas las monta este mismo bundle en la composicion del perfil
# (`privacy-helmcode` publica `workspace_read_anonymized` —y, en el resto de los
# perfiles, tambien `anonymize`: la fila de ESTE pack lo desactiva con
# `exposeAnonymize: false`, porque aqui toda lectura llega ya redactada—;
# `retrieval-helmcode` publica `knowledge_search` e `index_workspace`), y una
# herramienta registrada en la capa global es visible para toda sesion, incluida
# la de este preset. Volver a montar esos dos plugins dentro del preset crearia
# una SEGUNDA instancia del mapa de redaccion y una segunda fila con el mismo id;
# lo que el preset decide es que herramientas ADICIONALES del turno se montan, y
# recortar es no montarlas.
#
# EL CORTE DE LECTURA LO GARANTIZA EL HOST, no esta lista de herramientas: el
# pack monta `privacy-helmcode` con `vetoDirectReads: true`, asi que `read`,
# `grep` y `glob` se vetan en `tools/pre-execute` y no hay forma de que el modelo
# vea el contenido de un fichero sin pasar por `workspace_read_anonymized`. La
# lista de abajo decide que plugins se montan en el turno; el veto decide que
# llamadas se ejecutan, y una instruccion de skill no basta para lo segundo.
#
# RECORTE respecto de la lista de `standard`, con el motivo de cada uno:
#
#   - `tool-bash` y `tool-pwsh`: ejecutar ordenes no forma parte del trabajo con
#     documentacion clinica, y abren un segundo camino a los bytes de un fichero
#     que el flujo obligatorio de anonimizacion no gobierna. La guardia de egreso
#     tambien los veta en `eu-only` (`DEFAULT_EGRESS_TOOLS`), por la misma razon.
#   - `tool-jobs`: trabajos en segundo plano existen para ordenes largas; aqui no
#     hay ninguna.
#   - `command-goal`, `tool-goal` y el grupo `planning` (`plan-mode`):
#     contabilidad de objetivos y modo de planificacion de tareas de ingenieria;
#     un resumen o una revision clinica no es un plan de implementacion.
#   - El grupo `delegation` entero (`tool-subagent-control`, `list-agents`,
#     `subagent`, `subagent_fork`, `subagent_codex`, `subagent_claude_code`,
#     `workflow-ptc`, `tool-workflow`, `tool-ralph`): cada subagente abre su
#     propia sesion, su propio transcript y su propio turno contra el modelo. Un
#     pack regulado mantiene un unico turno responsable y un unico mapa de
#     redaccion.
#   - `tool-web`: egreso a la web abierta. En `eu-only` la guardia ya veta
#     `web_fetch` y `web_search` en `tools/pre-execute` (abren su propio trafico
#     y no pasan por `llm/stream`), asi que montar la herramienta solo ofreceria
#     llamadas que se deniegan; el resumen sale de la documentacion del
#     workspace.
#   - `tool-plugin-manager`: instalar plugins muta la composicion; no es una
#     capacidad clinica.
#
# LO QUE SE CONSERVA: `persona` (con el encuadre del sector), `agent-instructions`
# (las instrucciones del proyecto siguen contando), `tool-fs` (escribir el resumen
# y editar; sus lecturas —`read`— las veta el host) y `tool-fs-search` (buscar en
# el workspace: `grep` y `glob` tambien quedan vetados, asi que la busqueda de
# CONTENIDO se hace con `knowledge_search` sobre el indice, que ya devuelve los
# fragmentos redactados), la instancia propia de
# `skill-filesystem` con las dos skills del pack, `tool-skill` (invocarlas), el
# grupo `compaction` (un historial clinico largo se compacta sin perder el
# hilo), `tool-ask-user` (preguntar antes de suponer), `tool-todo` y `present`
# (entregar el resumen como fichero).
- insert:
    - id: preset-helmcode-salud
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: helmcode-salud
        name: Healthcare (anonymized)
        description: Clinical documentation work whose every read goes through workspace_read_anonymized, restricted to the tools a regulated clinical assistant needs.
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a clinical documentation assistant powered by the {{model}} model. You summarize and review clinical documents; you do not diagnose, you do not recommend treatment, and you do not substitute medical judgement.
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # La instancia PROPIA del pack. Dos instancias de `skill-filesystem`
          # conviven porque el registro indexa proveedores por nombre dentro de
          # cada capa y esta lleva `providerName` propio, igual que las dos filas
          # de `llm-pi-ai` de la capa Helmcode conviven con ids distintos.
          # `bundledSkillDir` anade la raiz del pack en el rango 600 (`bundled`),
          # que gana a una skill homonima de proyecto o de usuario y deja el flujo
          # obligatorio fuera del alcance de cualquiera que lo reescriba; las
          # raices por defecto siguen montadas, asi que las skills del proyecto y
          # del operador no desaparecen de una sesion de salud.
          - id: skill-filesystem-salud
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: salud
              bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-helmcode-salud/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
